<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سامانه هوشمند هشدار خطر حریق - کوهستان دراک</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; margin: 0; overflow: hidden;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background: #EEF4F9;
        }
        .app {
            width: 100%; max-width: 480px; height: 100vh; height: 100dvh;
            margin: 0 auto; padding: 10px 14px 8px;
            overflow: hidden; position: relative;
            display: flex; flex-direction: column;
            background: linear-gradient(to bottom, #F8FAFC, #EEF4F9 55%, #FFF5F5);
        }
        .app-content {
            position: relative; z-index: 1;
            display: flex; flex-direction: column; justify-content: space-between;
            flex: 1; min-height: 0; gap: 6px;
        }
        .header-title { font-size: 15px; line-height: 1.5; }
        
        .forecast-days-container {
            display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;
            scrollbar-width: none; flex-shrink: 0;
        }
        .forecast-days-container::-webkit-scrollbar { display: none; }
        .day-tab {
            flex: 0 0 auto; background: #FFFFFF; border: 1px solid #CBD5E1;
            border-radius: 10px; padding: 5px 10px; text-align: center;
            cursor: pointer; transition: all 0.2s ease;
        }
        .day-tab.active {
            background: #0284C7; color: #FFFFFF; border-color: #0284C7;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.3);
        }

        .gauge-section {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex: 1 1 auto; min-height: 0; padding: 2px 0;
        }
        .gauge-wrap {
            width: min(58vw, 220px, 29vh); height: min(58vw, 220px, 29vh);
            min-width: 170px; min-height: 170px; flex-shrink: 0;
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .gauge-conic-ring {
            width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(from 0deg at 50% 50%, #22C55E 0%, #84CC16 18%, #EAB308 36%, #F97316 58%, #EF4444 80%, #9333EA 100%);
            display: flex; align-items: center; justify-content: center;
            position: relative; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }
        .gauge-mask-svg {
            position: absolute; inset: 0; width: 100%; height: 100%;
            transform: rotate(-90deg); pointer-events: none;
        }
        #gauge-progress-circle {
            fill: none; stroke: #E2E8F0; stroke-width: 20;
            transition: stroke-dashoffset 0.8s ease;
        }
        .gauge-center-hole {
            width: calc(100% - 40px); height: calc(100% - 40px);
            background: #FFFFFF; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; z-index: 10; box-shadow: inset 0 2px 6px rgba(0,0,0,0.04); padding: 6px;
        }

        .compact-card { flex-shrink: 0; }
        .safety-card { padding: 9px 11px; }
        .safety-list { font-size: 11px; line-height: 1.7; }
        .gps-button { min-height: 40px; font-size: 12px; }
        .emergency-card { padding: 8px 10px; }
        .visitor-card { padding: 5px 10px; font-size: 11px; }
        .footer { flex-shrink: 0; font-size: 9px; text-align: center; color: #64748B; padding-top: 2px; }
    </style>
</head>

<body class="text-slate-800 antialiased">

<div class="app">
    <main class="app-content">
        <!-- سربرگ -->
        <header class="relative z-10 flex items-center justify-between flex-shrink-0">
            <button id="refresh-button" type="button" onclick="loadData()" class="p-2 text-slate-700 bg-white/90 rounded-xl shadow-sm" title="به‌روزرسانی">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            </button>

            <div class="text-center flex-1 mx-2">
                <h1 class="header-title font-black text-slate-800">سامانه هوشمند هشدار حریق</h1>
                <div class="text-[11px] font-bold text-rose-600">کوهستان دراک شیراز</div>
            </div>
            <div class="w-9"></div>
        </header>

        <!-- نوار انتخاب روزهای پیش‌بینی -->
        <div id="forecast-days" class="forecast-days-container relative z-10">
            <div class="day-tab active text-xs font-bold">بارگذاری روزها...</div>
        </div>

        <!-- گیج ارزیابی خطر -->
        <section class="gauge-section relative z-10">
            <div class="gauge-wrap">
                <div class="gauge-conic-ring">
                    <svg class="gauge-mask-svg" viewBox="0 0 200 200">
                        <circle id="gauge-progress-circle" cx="100" cy="100" r="90" stroke-dasharray="565.4" stroke-dashoffset="0"/>
                    </svg>

                    <div class="gauge-center-hole">
                        <div class="text-rose-500 mb-0.5">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M13.5.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.61 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5.67z"/></svg>
                        </div>
                        <div class="text-[10px] font-bold text-slate-500 mb-0.5" id="selected-date-title">امروز</div>
                        <div id="risk-pill" class="px-3 py-0.5 rounded-full text-white text-xs font-black bg-slate-500 shadow-sm">در حال پردازش</div>
                    </div>
                </div>
            </div>
            <div id="update-badge" class="text-[11px] text-slate-600 font-bold mt-1 text-center">آخرین به‌روزرسانی: در حال بررسی</div>
        </section>

        <!-- توصیه‌های ایمنی -->
        <section class="safety-card compact-card relative z-10 bg-rose-50/95 border border-rose-200 rounded-xl">
            <div class="flex items-center gap-1.5 mb-1">
                <span class="w-5 h-5 rounded-full bg-rose-500 text-white flex items-center justify-center text-xs font-black">!</span>
                <h2 class="text-xs font-extrabold text-slate-800">توصیه‌های ایمنی</h2>
            </div>
            <ul id="safety-tips" class="safety-list space-y-0.5 text-slate-700 font-medium list-disc list-inside">
                <li>در حال دریافت اطلاعات...</li>
            </ul>
        </section>

        <!-- GPS -->
        <section class="compact-card relative z-10">
            <button type="button" onclick="getGPS()" class="gps-button w-full bg-emerald-600 hover:bg-emerald-700 text-white px-3 rounded-xl font-bold flex items-center justify-center gap-2 shadow-md">
                <span>📍</span><span>ثبت موقعیت GPS و دریافت لینک اضطراری</span>
            </button>
            <div id="gps-status" class="text-center text-[10px] text-slate-600 font-medium mt-0.5 min-h-[12px]"></div>
        </section>

        <!-- تماس‌های اضطراری -->
        <section class="emergency-card compact-card relative z-10 bg-rose-50/90 border border-rose-200 rounded-xl">
            <div class="grid grid-cols-2 gap-2 bg-white rounded-lg p-1.5 border border-rose-100">
                <a href="tel:137" class="flex flex-col items-center justify-center py-0.5 border-l border-slate-100">
                    <div class="flex items-center gap-1 text-amber-600 font-black text-sm"><span>📞</span><span>۱۳۷</span></div>
                    <span class="text-[9px] text-slate-500 font-bold">شهرداری شیراز</span>
                </a>
                <a href="tel:125" class="flex flex-col items-center justify-center py-0.5">
                    <div class="flex items-center gap-1 text-rose-600 font-black text-sm"><span>🚒</span><span>۱۲۵</span></div>
                    <span class="text-[9px] text-slate-500 font-bold">آتش‌نشانی</span>
                </a>
            </div>
        </section>

        <footer class="footer relative z-10">سامانه پایش خطر حریق کوهستان دراک شیراز</footer>
    </main>
</div>

<script>
    // استفاده از مسیر مطلق نسبی برای اطمینان از خوانده شدن فایل در گیت‌هاب پیجز
    const DATA_URL = './data/derak_fwi_forecast.json';
    const MAX_VALUE = 60;
    const CIRCUMFERENCE = 2 * Math.PI * 90;
    let forecastDataCache = [];
    let selectedDayIndex = 0;

    function toPersianDigits(val) {
        return String(val ?? '').replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    }

    function updateGauge(val) {
        const circle = document.getElementById('gauge-progress-circle');
        if (!circle) return;
        const ratio = Math.max(0, Math.min(1, val / MAX_VALUE));
        circle.style.strokeDashoffset = -CIRCUMFERENCE * ratio;
    }

    function renderDayDetails(dayObj) {
        if (!dayObj) return;
        const pill = document.getElementById('risk-pill');
        const dateTitle = document.getElementById('selected-date-title');
        
        const fwiVal = Number(dayObj.mean_fwi ?? dayObj.fwi ?? 15);
        pill.textContent = `${dayObj.risk_level_fa || 'متوسط'} (${fwiVal.toFixed(1)})`;
        pill.style.backgroundColor = dayObj.risk_color || '#EAB308';
        dateTitle.textContent = dayObj.date || 'امروز';

        updateGauge(fwiVal);
        updateTips(fwiVal);
    }

    function updateTips(val) {
        let tips = [];
        if (val >= 50) {
            tips = ['خطر بسیار شدید؛ از ورود به ارتفاعات دراک جداً خودداری کنید.', 'هرگونه روشن کردن آتش ممنوع است.', 'در صورت مشاهده دود با ۱۲۵ تماس بگیرید.'];
        } else if (val >= 30) {
            tips = ['خطر حریق بالا است؛ از روشن کردن آتش پرهیز کنید.', 'ته‌سیگار و مواد مشتعل در طبیعت رها نکنید.'];
        } else {
            tips = ['وضعیت پایدار است؛ لطفاً اصول ایمنی طبیعت‌گردی را رعایت فرمایید.'];
        }

        const list = document.getElementById('safety-tips');
        if (!list) return;
        list.replaceChildren();
        tips.forEach(t => {
            const li = document.createElement('li');
            li.textContent = t;
            list.appendChild(li);
        });
    }

    async function loadData() {
        try {
            const res = await fetch(DATA_URL + '?v=' + Date.now(), { cache: 'no-store' });
            if (!res.ok) throw new Error('فایل داده یافت نشد');
            const data = await res.json();
            
            // سازگاری با ساختارهای مختلف خروجی پایتون
            forecastDataCache = data.forecast || data.data || (Array.isArray(data) ? data : []);
            
            const daysContainer = document.getElementById('forecast-days');
            daysContainer.replaceChildren();

            if (forecastDataCache.length === 0) {
                throw new Error('آرایه پیش‌بینی خالی است');
            }

            forecastDataCache.forEach((day, idx) => {
                const tab = document.createElement('div');
                tab.className = `day-tab text-xs font-bold ${idx === selectedDayIndex ? 'active' : ''}`;
                const dayVal = Number(day.mean_fwi ?? day.fwi ?? 0);
                tab.innerHTML = `<div>${day.date || 'روز ' + (idx+1)}</div><div class="text-[10px] opacity-80">${toPersianDigits(dayVal.toFixed(1))}</div>`;
                tab.onclick = () => {
                    selectedDayIndex = idx;
                    document.querySelectorAll('.day-tab').forEach(el => el.classList.remove('active'));
                    tab.classList.add('active');
                    renderDayDetails(day);
                };
                daysContainer.appendChild(tab);
            });

            renderDayDetails(forecastDataCache[selectedDayIndex]);
            document.getElementById('update-badge').textContent = 'آخرین به‌روزرسانی: ' + toPersianDigits(data.generated_at || 'موفق');

        } catch (err) {
            console.warn('خطا در بارگذاری داده اصلی، استفاده از حالت پیش‌فرض:', err);
            
            // داده تستی در صورت عدم وجود فایل برای جلوگیری از ارور صفحه
            const mockData = [
                { date: "امروز", mean_fwi: 18.5, risk_level_fa: "متوسط", risk_color: "#EAB308" },
                { date: "فردا", mean_fwi: 24.2, risk_level_fa: "زیاد", risk_color: "#F97316" }
            ];
            
            forecastDataCache = mockData;
            const daysContainer = document.getElementById('forecast-days');
            daysContainer.replaceChildren();
            
            mockData.forEach((day, idx) => {
                const tab = document.createElement('div');
                tab.className = `day-tab text-xs font-bold ${idx === selectedDayIndex ? 'active' : ''}`;
                tab.innerHTML = `<div>${day.date}</div><div class="text-[10px] opacity-80">${toPersianDigits(day.mean_fwi)}</div>`;
                tab.onclick = () => {
                    selectedDayIndex = idx;
                    document.querySelectorAll('.day-tab').forEach(el => el.classList.remove('active'));
                    tab.classList.add('active');
                    renderDayDetails(day);
                };
                daysContainer.appendChild(tab);
            });

            renderDayDetails(mockData[selectedDayIndex]);
            document.getElementById('update-badge').textContent = 'حالت نمایش تستی (در انتظار اجرای اکشن)';
        }
    }

    function getGPS() {
        const status = document.getElementById('gps-status');
        if (!navigator.geolocation) {
            status.textContent = 'مرورگر از مکان‌یابی پشتیبانی نمی‌کند.';
            return;
        }
        status.textContent = 'در حال دریافت موقعیت...';
        navigator.geolocation.getCurrentPosition(pos => {
            const lat = pos.coords.latitude.toFixed(6);
            const lon = pos.coords.longitude.toFixed(6);
            const link = `https://maps.google.com/?q=${lat},${lon}`;
            status.innerHTML = `<a href="${link}" target="_blank" class="text-blue-600 underline font-bold">نمایش موقعیت روی نقشه</a>`;
        }, () => {
            status.textContent = 'خطا در دریافت مختصات GPS.';
        });
    }

    loadData();
</script>
</body>
</html>
